<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Management System</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            padding-top: 50px;
            background-color: #f5f5f5;
        }

         .login-container {
            border: 0.1px solid rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            width: 400px;
            margin: 80px auto;
            text-align: center;
        }
        input{
            width: 250px;
            height: 5px;
            border-width: 0 0 1px 0;
            padding-left: 10px;
            background-color: white;
            margin-top: 10px;
            cursor: pointer;
        }
        input:focus{
            height: 35px;
        }
        .loginForm{
            height: 50%;

        }
        .loginbtn{
            margin: 40px 40px 20px 70px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            width: 150px;
            height: 40px;
            color: white;
            background-color: #42a5f5;
        }

        .username, 
        .password {
            position: relative;
            margin: 40px 0;
        }
        .username input,
        .password input {
            width: 80%;
            padding: 10px 5px;
            font-size: 16px;
            border: none;
            border-bottom: 2px solid #999;
            outline: none;
            background: transparent;
            transition: all 0.3s ease;
        }
        .username input:focus,
        .password input:focus {
            border-bottom: 2px solid #42a5f5;
            padding: 15px 5px 5px 5px;   /* height increases */
        }
        .username label,
        .password label {
            position: absolute;
            left: 40%;
            top: 10px;
            font-size: 16px;
            color: #999;
            pointer-events: none;
            transition: 0.3s ease all;
        }
        .username input:focus + label,
        .password input:focus + label {
            top: -12px;
            font-size: 13px;
            color: #42a5f5;
        }
        .username input:not(:placeholder-shown) + label,
        .password input:not(:placeholder-shown) + label {
            top: -12px;
            font-size: 13px;
            color: #42a5f5;
        }
        .usernameError,
        .passwordError {
            display: none;
            color: red;
            font-size: 12px;
            margin-top: 5px;
            margin-left: 0%;
        }
 
    </style>
</head>
<body>
    <main>
        <div class="login-container">
            <h1 style="color: #42a5f5;">Welcome Back</h1>
            <form action="" class="loginForm" id="LoginForm">
            <div class="username">
            <input type="text" name="username" id="username" placeholder=" " required>
            <label for="username">Username</label>
            <span class="usernameError" id="usernameError">Invalid Username</span>
            </div>
            <div class="password">
            <input type="password" name="password" id="password" placeholder=" " required>
            <label for="password">Password</label>
            <span class="passwordError" id="passwordError">Invalid Password</span>
            </div>
            <button class="loginbtn">Login</button>
            </form>
        </div>
    </main>
</body>
<script>
document.getElementById("LoginForm").addEventListener("submit", function(e){
    e.preventDefault();
    window.location.href = "homepage.html";
});
</script>
</html>
